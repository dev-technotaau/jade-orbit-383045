# Prometheus scrape configuration for the WhatsApp Cloud console backend.
#
# A snippet, not a whole prometheus.yml: paste the `scrape_configs` entry into
# yours and load deploy/alerts.yml alongside it.
#
#   global:
#     scrape_interval: 30s
#   rule_files:
#     - /etc/prometheus/rules/alerts.yml
#   scrape_configs:
#     - <the job below>
#
# ── Authentication ────────────────────────────────────────────────────────────
# /metrics is NOT public. backend/src/app.ts mounts it behind `requireMetricsToken`
# (backend/src/middleware/app-password.ts), which accepts
# `Authorization: Bearer $METRICS_TOKEN` and otherwise falls back to the operator
# app-password gate — so a scrape without the header gets a 401, not a metrics
# page. Set METRICS_TOKEN in the backend environment and give Prometheus the same
# value through a file it reads at runtime; never inline the secret here.
#
# ── Deployments with no Prometheus ────────────────────────────────────────────
# On a managed host (this repo ships a Render blueprint) there is usually no
# scrape target at all. The console covers the same three failure modes without
# it: GET /whatsapp/system-status — queue depth, worker leadership, webhook
# silence and channel quality — rendered on /whatsapp/settings. It is a
# point-in-time read with no history and no paging, so it is a floor, not a
# replacement for the rules in alerts.yml.

scrape_configs:
  - job_name: whatsapp-cloud-api
    metrics_path: /metrics
    scheme: https
    scrape_interval: 30s
    # The scrape does one prom-client registry render plus a Redis round trip per
    # queue; 10s is comfortable, and the timeout only has to beat the interval.
    scrape_timeout: 10s

    # The METRICS_TOKEN value, mounted as a file (Kubernetes secret, Docker
    # secret, or 0400 on disk). `authorization.credentials_file` keeps it out of
    # this file and out of `promtool`'s output.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/whatsapp-metrics-token

    static_configs:
      - targets:
          - api.example.com # ← the backend host
        labels:
          service: whatsapp-cloud-api
          env: production

    # Every replica must be scraped, not one behind a load balancer.
    #
    # Worker leadership (`wa_worker_leader`) is per-instance and the alerts sum it
    # across replicas: 1 healthy, 0 nothing draining the queues, >1 split brain.
    # Scraping through a load balancer round-robins the target and turns that sum
    # into a coin flip. Use a DNS/Kubernetes SD that resolves to the pods
    # themselves — the commented block below is the Kubernetes form.
    #
    # - job_name: whatsapp-cloud-api
    #   kubernetes_sd_configs:
    #     - role: pod
    #   relabel_configs:
    #     - source_labels: [__meta_kubernetes_pod_label_app]
    #       action: keep
    #       regex: whatsapp-cloud-api
    #     - source_labels: [__meta_kubernetes_pod_container_port_number]
    #       action: keep
    #       regex: '5000'
