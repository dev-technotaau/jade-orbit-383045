# Dependency updates.
#
# The tree is otherwise patched only when someone happens to look: there is no
# renovate bot, and `npm audit` runs in CI (see ci.yml) but only reports what is
# already installed — it never opens the PR that would fix it.
#
# One entry per manifest, because this repo is NOT an npm workspace: the root,
# `backend/` and `frontend/` each have their own package.json and lockfile, and
# a single `/` entry would leave the two that actually ship unmonitored.
version: 2

updates:
  # Root — tooling only (husky, lint-staged, prettier, commitlint).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      # Conventional-commit prefix so the bot's commits satisfy
      # commitlint.config.js like every other commit in the history — the
      # commit-msg hook that enforces it locally never runs on a bot branch.
      prefix: chore
      include: scope
    groups:
      # Minor and patch bumps arrive as ONE pull request. Ungrouped, a weekly
      # run on three manifests opens a dozen PRs nobody reviews, which is how
      # a bot like this gets muted.
      tooling:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # The workflow's own actions pin to @v4 tags that go stale and eventually
  # start warning about deprecated Node runtimes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
