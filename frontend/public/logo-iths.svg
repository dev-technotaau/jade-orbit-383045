<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148.5 48" width="148.5" height="48" role="img" aria-label="ITHS">
  <!--
    ITHS lockup. Deliberately contains NO <text>: the letterforms are rects and
    one bezier, so the mark is byte-identical on Windows, macOS and Android and
    the viewBox can hug the ink exactly. A <text> wordmark renders at a
    different width per platform, which is what left the previous logo sitting
    off-centre inside its own box.

    Ink spans x 0 -> 148.5 with no padding, so any container that centres the
    element also centres the artwork.
  -->
  <defs>
    <linearGradient id="ithsG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e5caf"/>
      <stop offset="1" stop-color="#154a91"/>
    </linearGradient>

    <!-- Letterforms at the origin: 96.5 wide x 28 tall. Drawn once, used twice
         (small + white inside the tile, large + two-tone as the wordmark).
         Rects declare stroke="none" and the S declares fill="none", so each
         <use> can set both fill and stroke to a single colour safely. -->
    <g id="ithsIT" stroke="none">
      <rect x="0" y="0" width="6.5" height="28" rx="1.5"/>
      <rect x="11.5" y="0" width="25" height="6.5" rx="1.5"/>
      <rect x="20.75" y="0" width="6.5" height="28" rx="1.5"/>
    </g>
    <g id="ithsHS">
      <rect x="41.5" y="0" width="6.5" height="28" rx="1.5" stroke="none"/>
      <rect x="61" y="0" width="6.5" height="28" rx="1.5" stroke="none"/>
      <rect x="41.5" y="10.75" width="26" height="6.5" rx="1.5" stroke="none"/>
      <path d="M93.25,7.98 C93.25,4.97 89.4,3.25 84.5,3.25 C79.6,3.25 75.75,4.97 75.75,8.63
               C75.75,12.28 79.6,14 84.5,14 C89.4,14 93.25,15.72 93.25,19.38
               C93.25,23.03 89.4,24.75 84.5,24.75 C79.6,24.75 75.75,23.03 75.75,20.02"
            fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Icon tile -->
  <rect x="0" y="4" width="40" height="40" rx="9" fill="url(#ithsG)"/>
  <g transform="translate(4,19.36) scale(0.3316)" fill="#fff" stroke="#fff">
    <use href="#ithsIT"/>
    <use href="#ithsHS"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(52,10)">
    <use href="#ithsIT" fill="#0f1720" stroke="#0f1720"/>
    <use href="#ithsHS" fill="#1e5caf" stroke="#1e5caf"/>
  </g>
</svg>
