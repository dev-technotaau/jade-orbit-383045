# ============================================================
# Hire Adda — Ingress Configuration
# Routes all domains through nginx-ingress with SSL
# Replaces: backend/nginx/conf.d/default.conf
# ============================================================

# ── API Ingress (api.hireadda.in) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: hire-adda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSL
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    # HSTS (2 years)
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '63072000'
    nginx.ingress.kubernetes.io/hsts-include-subdomains: 'true'
    # Rate limiting (matches existing: 10r/s for API)
    nginx.ingress.kubernetes.io/limit-rps: '10'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '2'
    nginx.ingress.kubernetes.io/limit-connections: '20'
    # Request size (10MB for uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/client-body-buffer-size: '128k'
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-http-version: '1.1'
    # Sticky sessions for Socket.IO
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/session-cookie-name: 'SERVERID'
    nginx.ingress.kubernetes.io/session-cookie-hash: 'sha1'
    nginx.ingress.kubernetes.io/session-cookie-max-age: '3600'
    # Proxy headers
    nginx.ingress.kubernetes.io/proxy-set-headers: 'hire-adda/custom-headers'
    # ModSecurity WAF
    nginx.ingress.kubernetes.io/enable-modsecurity: 'true'
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: 'true'
    # IMPORTANT: every SecRule must be on a single line. SecLang
    # supports `\` line-continuation but nginx-ingress's templating
    # passes the snippet to nginx via a `modsecurity_rules_file` mode
    # that doesn't honour line continuation — splitting a SecRule
    # across lines produces "nginx: [emerg] unexpected ... " at
    # config-reload time and takes down EVERY host this controller
    # serves until rolled back. Keep the rules verbose-on-one-line.
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecAuditEngine RelevantOnly
      SecAuditLogRelevantStatus "^(?:5|4(?!04))"
      SecRule REQUEST_URI "@beginsWith /socket.io/" "id:1010,phase:1,pass,nolog,ctl:ruleEngine=Off"
      SecRule REQUEST_HEADERS:Upgrade "@streq websocket" "id:1011,phase:1,pass,nolog,ctl:ruleEngine=Off"
      SecRule REQUEST_URI "@beginsWith /api/v1/webhooks/" "id:1012,phase:1,pass,nolog,ctl:ruleEngine=Off"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(self), geolocation=(self), interest-cohort=()";
    # Hide server version
    nginx.ingress.kubernetes.io/server-snippet: |
      server_tokens off;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.hireadda.in
      secretName: api-hireadda-tls
  rules:
    - host: api.hireadda.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
---
# ── Auth Rate Limiting Ingress (stricter for login/register) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-auth-ingress
  namespace: hire-adda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Strict rate limit: 5 requests per minute for auth
    nginx.ingress.kubernetes.io/limit-rps: '1'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    nginx.ingress.kubernetes.io/limit-connections: '5'
    nginx.ingress.kubernetes.io/proxy-body-size: '1m'
    nginx.ingress.kubernetes.io/enable-modsecurity: 'true'
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.hireadda.in
      secretName: api-hireadda-tls
  rules:
    - host: api.hireadda.in
      http:
        paths:
          - path: /api/v1/auth/login
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /api/v1/auth/register
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 5000
---
# ── Frontend Ingress (hireadda.in) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: hire-adda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '63072000'
    nginx.ingress.kubernetes.io/hsts-include-subdomains: 'true'
    # 20m so WhatsApp inbox media uploads (images/video/docs up to the 16 MB
    # multer cap) aren't rejected by the ingress before reaching the backend.
    nginx.ingress.kubernetes.io/proxy-body-size: '20m'
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # WebSocket for HMR in dev (harmless in prod)
    nginx.ingress.kubernetes.io/proxy-http-version: '1.1'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    # Larger upstream response-header buffer. Default 4 KB was blown
    # past by the BFF's POST /api/auth/login response (5 Set-Cookie
    # lines for ha_access_token + ha_refresh_token + 3 indicator
    # cookies — JWT-bearing cookies are ~700 bytes each + cookie
    # attributes, total response headers ~5 KB+). Symptom on the
    # default buffer was "upstream sent too big header" in
    # ingress-nginx error log + 502 to the client. 16 KB is generous
    # headroom even if we add more cookies / inflate JWT claims later.
    nginx.ingress.kubernetes.io/proxy-buffer-size: '16k'
    nginx.ingress.kubernetes.io/proxy-buffers-number: '8'
    # Sticky sessions — pin all requests from one browser to the same
    # frontend pod for the duration of the session. The BFF's auth
    # refresh logic (frontend/src/app/api/auth/_lib/refresh.ts) uses a
    # *module-level* mutex + TTL cache to serialise refresh attempts
    # so they don't race against the backend's refresh-token rotation.
    # That mutex is per-pod; with 2 frontend pods and no affinity, a
    # burst of parallel auth-required requests (dashboard mount fires
    # 3-4 concurrently) splits across both pods, each refreshes
    # independently, the second refresh uses the now-revoked token,
    # backend revokes the entire token family → user auto-logged-out.
    # Sticky sessions keep all of one user's requests on one pod so
    # the in-process mutex is actually effective.
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/session-cookie-name: 'FRONTEND_SERVERID'
    nginx.ingress.kubernetes.io/session-cookie-hash: 'sha1'
    nginx.ingress.kubernetes.io/session-cookie-max-age: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hireadda.in
        - www.hireadda.in
        - mta-sts.hireadda.in
      secretName: frontend-hireadda-tls
  rules:
    - host: hireadda.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.hireadda.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    # ── MTA-STS policy host ──
    # Serves EXACTLY ONE url: /.well-known/mta-sts.txt (RFC 8461 §3.3). Every
    # other path falls through to the ingress default backend and 404s.
    #
    # This was `path: / pathType: Prefix` until 2026-08-05, which routed the
    # WHOLE Next.js app to this hostname. The app is host-blind — robots.txt is
    # `force-static` (frontend/src/app/robots.txt/route.ts:522) and
    # `X-Robots-Tag: index, follow` is bound to `source: '/(.*)'`
    # (frontend/next.config.ts:115-118), neither of which can see the Host — so
    # the whole site was crawlable and indexable under mta-sts.hireadda.in.
    #
    # DO NOT widen this back to `/`, and DO NOT 301 this path to the apex:
    # RFC 8461 §3.3 forbids senders from following 3xx when fetching the
    # policy, so a redirect silently disables MTA-STS once cached policies hit
    # max_age (7d). The policy is `mode: enforce` — that is live downgrade
    # protection for mail.
    - host: mta-sts.hireadda.in
      http:
        paths:
          - path: /.well-known/mta-sts.txt
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
# ── OTel Ingress (browser traces → nginx → otel-collector) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-ingress
  namespace: hire-adda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '64k'
    # Rate limit browser traces (2 req/s per IP)
    nginx.ingress.kubernetes.io/limit-rps: '2'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hireadda.in
      secretName: frontend-hireadda-tls
  rules:
    - host: hireadda.in
      http:
        paths:
          - path: /otel/
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
---
# ── Mail Webmail Ingress (mail.hireadda.in) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-ingress
  namespace: hire-adda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
